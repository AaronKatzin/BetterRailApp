name: Aaron Rail preview APK

# Fork-only sideload builder for AaronKatzin/BetterRailApp.
# Upstream Play Store releases stay on release.yml / store-release.yml.
#
# Native project is generated by `expo prebuild` (android/ is gitignored). The
# release JS bundle is produced by Gradle's `expo export:embed` (the same path
# EAS uses), not `react-native bundle`.
#
# R8 and resource shrinking stay off. app.config.ts sets
# android.enableMinifyInReleaseBuilds=false because reflection-heavy libraries
# have no keep rules. A previous arm64 release that forced R8 on crashed at
# launch: a route module failed while loading, Metro's guarded require returned
# undefined, and expo-router threw
# "Cannot read property 'ErrorBoundary' of undefined".

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aaron-rail-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    if: github.repository == 'AaronKatzin/BetterRailApp'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AARON_RAIL_PREVIEW: "1"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_GIT_STATUS: "1"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            || true
          df -h /

      - name: Cache JS dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::GitHub-hosted Android SDK was not found at $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          if [ -z "$SM" ]; then
            echo "::error::sdkmanager is missing under $SDK/cmdline-tools"
            exit 1
          fi
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"

      - name: Prebuild Android
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --no-install

      - name: Debug keystore and arm64-only release
        run: |
          set -euo pipefail
          KS=apps/mobile/android/app/debug.keystore
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -v \
              -keystore "$KS" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          PROPS=apps/mobile/android/gradle.properties
          upsert() {
            local key="$1" value="$2"
            if grep -q "^${key}=" "$PROPS"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$PROPS"
            else
              printf '\n%s=%s\n' "$key" "$value" >> "$PROPS"
            fi
          }
          upsert reactNativeArchitectures arm64-v8a
          upsert android.enableMinifyInReleaseBuilds false
          grep -q '^android.enableMinifyInReleaseBuilds=false$' "$PROPS"
          grep -q "applicationId 'com.aaronkatzin.rail'" apps/mobile/android/app/build.gradle
          grep -q 'namespace '"'"'com.betterrail'"'"'' apps/mobile/android/app/build.gradle

      - name: Assemble release APK
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --build-cache \
            --stacktrace

      - name: Check the APK and embedded route bundle
        id: verify
        run: |
          set -euo pipefail
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT=$(find "$SDK/build-tools" -type f -name aapt | sort | tail -1)
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort | tail -1)
          BADGING=$("$AAPT" dump badging "$APK")
          printf '%s\n' "$BADGING" | head -n 30
          printf '%s\n' "$BADGING" | grep -q "package: name='com.aaronkatzin.rail'"
          printf '%s\n' "$BADGING" | grep -q "application-label:'Aaron Rail'"
          NATIVE=$(printf '%s\n' "$BADGING" | grep '^native-code:' || true)
          echo "native-code: $NATIVE"
          printf '%s\n' "$NATIVE" | grep -q "arm64-v8a"
          if printf '%s\n' "$NATIVE" | grep -Eq 'armeabi|x86'; then
            echo "::error::APK contains an ABI other than arm64-v8a"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"
          if find apps/mobile/android/app/build/outputs/mapping -name mapping.txt | grep -q .; then
            echo "::error::R8 produced mapping.txt. Leave minify off; it crashes this app on launch."
            exit 1
          fi

          BUNDLE_PATH=$(unzip -Z1 "$APK" | grep -E '(^|/)index\.android\.bundle$' | head -n 1)
          if [ -z "$BUNDLE_PATH" ]; then
            echo "::error::index.android.bundle is missing from the APK"
            unzip -l "$APK" | head -n 50
            exit 1
          fi
          unzip -p "$APK" "$BUNDLE_PATH" > "$RUNNER_TEMP/embedded.bundle"
          SIZE=$(wc -c < "$RUNNER_TEMP/embedded.bundle")
          echo "embedded bundle bytes: $SIZE"
          if [ "$SIZE" -lt 2000000 ]; then
            echo "::error::Embedded JS bundle is unexpectedly small ($SIZE bytes)"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/embedded.bundle" << 'PY'
          import pathlib, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          root = pathlib.Path("apps/mobile/app")
          missing = []
          for path in sorted(root.rglob("*")):
              if path.suffix not in {".js", ".jsx", ".ts", ".tsx"}:
                  continue
              rel = "./" + path.relative_to(root).as_posix()
              if rel.encode() not in data and rel.encode("utf-16le") not in data:
                  missing.append(rel)
          if missing:
              print("Route modules missing from the embedded bundle:", file=sys.stderr)
              print("\n".join(missing), file=sys.stderr)
              sys.exit(1)
          print(f"embedded bundle contains {len(list(root.rglob('*.tsx')))} route files")
          PY

          cp "$APK" "$RUNNER_TEMP/AaronRail-arm64.apk"
          echo "apk=$RUNNER_TEMP/AaronRail-arm64.apk" >> "$GITHUB_OUTPUT"

      - name: Publish rolling pre-release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.verify.outputs.apk }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          SANITIZED=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          if [ -z "$SANITIZED" ]; then
            echo "::error::Branch name sanitized to an empty tag"
            exit 1
          fi
          TAG="preview-${SANITIZED}"
          APK_NAME="AaronRail-arm64.apk"
          cp "$APK" "$RUNNER_TEMP/$APK_NAME"
          SIZE=$(du -h "$RUNNER_TEMP/$APK_NAME" | awk '{print $1}')
          SHA=$(git rev-parse --short HEAD)
          cat > "$RUNNER_TEMP/notes.md" << EOF
          Sideload preview of **Aaron Rail** (\`com.aaronkatzin.rail\`) from \`$BRANCH\` @ \`$SHA\`.

          - arm64-v8a release
          - R8 off, matching the app release config
          - Signed with the Android debug keystore
          - Size: $SIZE

          \`\`\`
          adb install -r $APK_NAME
          \`\`\`
          EOF

          for _ in 1 2 3; do
            gh release delete "$TAG" --yes --cleanup-tag || true
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
            if gh release create "$TAG" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Aaron Rail preview ($BRANCH)" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "$RUNNER_TEMP/$APK_NAME"; then
              break
            fi
            sleep 3
          done
          gh release view "$TAG" --json tagName,assets --jq '.tagName + " " + ([.assets[].name] | join(","))'

          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          echo "download_url=$URL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Comment on the open pull request
        uses: actions/github-script@v8
        env:
          DOWNLOAD_URL: ${{ steps.release.outputs.download_url }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}
        with:
          script: |
            const marker = "<!-- aaron-rail-preview-apk -->";
            const { owner, repo } = context.repo;
            const branch = context.ref.replace(/^refs\/heads\//, "");
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
              per_page: 20,
            });
            if (prs.length === 0) {
              core.info(`No open pull request for ${branch}`);
              return;
            }
            const apk = process.env.APK_NAME;
            const url = process.env.DOWNLOAD_URL;
            const sha = context.sha.slice(0, 7);
            const body = [
              marker,
              `**Aaron Rail preview** (\`com.aaronkatzin.rail\`) from \`${sha}\``,
              "",
              `[Download ${apk}](${url})`,
              "",
              "```",
              `adb install -r ${apk}`,
              "```",
            ].join("\n");
            for (const pr of prs) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const existing = comments.filter((comment) => comment.body && comment.body.includes(marker));
              if (existing.length === 0) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body,
                });
                continue;
              }
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing[0].id,
                body,
              });
              for (const extra of existing.slice(1)) {
                try {
                  await github.rest.issues.deleteComment({ owner, repo, comment_id: extra.id });
                } catch (error) {
                  core.warning(`Could not delete extra preview comment ${extra.id}: ${error.message}`);
                }
              }
            }
